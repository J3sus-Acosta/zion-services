version: '3.8'

services:
  # -----------------------------------------------------------
  # BASE DE DATOS MYSQL 8 CON PERSISTENCIA
  # -----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: zion-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-zion_root_secure_pass_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zion_services}
      MYSQL_USER: ${MYSQL_USER:-zion_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zion_pass_secure_2026}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - zion-network

  # -----------------------------------------------------------
  # BACKEND API EXPRESS + TYPESCRIPT (NODE 22)
  # -----------------------------------------------------------
  backend:
    build:
      context: .
      target: backend-runner
    container_name: zion-backend
    restart: always
    depends_on:
      - mysql
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: mysql://zion_user:${MYSQL_PASSWORD:-zion_pass_secure_2026}@mysql:3306/zion_services
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      STORAGE_PATH: /app/uploads
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - zion-network

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local

networks:
  zion-network:
    driver: bridge
